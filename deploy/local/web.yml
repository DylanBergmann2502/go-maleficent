# deploy/local/web.yml
name: go_maleficent_local

volumes:
  postgres_data: {}
  postgres_data_backups: {}
  redis_data: {}

services:
  go:
    build:
      context: ../..
      dockerfile: ./deploy/local/compose/go/Dockerfile
    image: go
    container_name: go
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.envs/.go
    ports:
      - "8000:8000"
    volumes:
      - ../..:/app
    command: /start

  go_worker:
    build:
      context: ../..
      dockerfile: ./deploy/local/compose/go/Dockerfile
    image: go
    container_name: go_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.envs/.go
    volumes:
      - ../..:/app
    command: /worker

  go_cron:
    build:
      context: ../..
      dockerfile: ./deploy/local/compose/go/Dockerfile
    image: go
    container_name: go_cron
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.envs/.go
    volumes:
      - ../..:/app
    command: /cron

  go_test:
    profiles:
      - test
    build:
      context: ../..
      dockerfile: ./deploy/local/compose/go/Dockerfile
    image: go
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.envs/.go
      - ./.envs/.go_test
    volumes:
      - ../..:/app
    command: /test

  postgres:
    build:
      context: ../..
      dockerfile: ./deploy/production/compose/postgres/Dockerfile
    image: postgres
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_data_backups:/backups
    env_file:
      - ./.envs/.postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
