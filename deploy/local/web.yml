# deploy/local/web.yml
name: go_maleficent_local

volumes:
  postgres_data: {}
  postgres_data_backups: {}

services:
  go:
    build:
      context: ../..
      dockerfile: ./deploy/local/compose/go/Dockerfile
    image: go
    container_name: go
    depends_on:
      - postgres
    env_file:
      - ./.envs/.go
    ports:
      - "8000:8000"
    volumes:
      - ../..:/app
    command: /start

  postgres:
    build:
      context: ../..
      dockerfile: ./deploy/production/compose/postgres/Dockerfile
    image: postgres
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_data_backups:/backups
    env_file:
      - ./.envs/.postgres
